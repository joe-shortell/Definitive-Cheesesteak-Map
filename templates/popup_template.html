<style>
    /* Override Leaflet's wrapper, but preserve the pointer tip */
    .leaflet-popup-content-wrapper {{
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
    }}

    .leaflet-popup-content {{
        margin: 0 !important;
        padding: 0 !important;
        width: auto !important;
        max-width: none !important;
    }}

    /* Restore the triangle tip and match it to popup background */
    .leaflet-popup-tip {{
        background: {background_color} !important;
        box-shadow: {shadow} !important;
        border: 2px solid {border_color} !important;
    }}

    .popup-container {{
        font-family: {font_family};
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }}
</style>

<div class="popup-container" style="
    display: flex; 
    border: 2px solid {border_color}; 
    border-radius: {border_radius}; 
    padding: {padding}; 
    width: {width};  
    background-color: {background_color}; 
    color: {text_color}; 
    box-shadow: {shadow};
">
    <div style="
        flex: 2.2; 
        margin-right: 10px; 
        border-right: 2px solid {border_color}; 
        padding-right: 10px;
    ">
        <h4 style="margin: 0; {title_font_style}">{location}</h4>
        <p style="margin: 5px 0; {body_font_style}">{description}</p>
    </div>
    <div style="
        flex: 1.2; 
        border-left: 2px solid {border_color}; 
        padding-left: 10px; 
        display: flex; 
        align-items: flex-start;
    ">
        {image_carousel}
    </div>
</div>
