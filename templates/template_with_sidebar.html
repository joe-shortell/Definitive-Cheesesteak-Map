<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cheesesteak Map</title>

  <style>
    body {
      margin: 0;
      display: flex;
      font-family: Georgia, serif;
      height: 100vh;
    }

    #sidebar {
      width: 300px;
      padding: 20px;
      background: linear-gradient(to bottom, #f5f2ea, #e8e0d0);
      border-right: 2px solid #ccc;
      box-shadow: 2px 0 6px rgba(0,0,0,0.2);
      overflow-y: auto;
    }

    #map-container {
      flex: 1;
      height: 100vh;
    }

    ul.legend {
      list-style: none;
      padding-left: 0;
      margin-top: 20px;
    }

    .legend li {
      margin-bottom: 10px;
    }

    .legend img {
      height: 32px;
      vertical-align: middle;
      margin-right: 8px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <div class="sidebar-section">
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>

    <div class="sidebar-section">
      <div class="legend-wrapper">
        <ul class="legend">
          {{ legend_items | safe }}
        </ul>
      </div>
    </div>
  </div>

  <div id="map-container">
    <iframe src="map.html"></iframe>
  </div>
</body>
</html>
