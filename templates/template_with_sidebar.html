<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>

  <style>
    body {
      margin: 0;
      display: flex;
      font-family: {{ sidebar_style['font_family'] }};
      height: 100vh;
    }

    #sidebar {
      width: {{ sidebar_style['width'] }};
      padding: {{ sidebar_style['padding'] }};
      background: {{ sidebar_style['sidebar_bg'] }};
      border-right: {{ sidebar_style['border_right'] }};
      box-shadow: {{ sidebar_style['box_shadow'] }};
      overflow-y: {{ sidebar_style['overflow_y'] }};
    }

    #map-container {
      flex: 1;
      height: 100vh;
    }

    ul.legend {
      list-style: none;
      padding-left: 0;
      margin-top: 20px;
    }

    .legend li {
      {{ sidebar_style['legend_item_style'] }}
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <div class="sidebar-section">
      <h1 style="{{ sidebar_style['title_style'] }}">{{ title }}</h1>
      <p style="{{ sidebar_style['body_text_style'] }}">{{ description }}</p>
    </div>

    <div class="sidebar-section">
      <div class="legend-wrapper">
        <ul class="legend">
          {{ legend_items | safe }}
        </ul>
      </div>
    </div>
  </div>

  <div id="map-container">
    <iframe src="map.html"></iframe>
  </div>
</body>
</html>
