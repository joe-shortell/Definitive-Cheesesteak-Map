<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Cheesesteak Guide to Philadelphia</title>

  <style>
    body {
      margin: 0;
      display: flex;
      font-family: 'Raleway', sans-serif;
      height: 100vh;
    }

    #sidebar {
      width: 300px;
      padding: 20px;
      background: linear-gradient(to bottom, #e9efe8, #a4b99f, #e4d7c5, #c37c65);
      border-right: 2px solid #ccc;
      box-shadow: 2px 0 6px rgba(0,0,0,0.2);
      overflow-y: auto;
    }

    #map-container {
      flex: 1;
      height: 100vh;
    }

    ul.legend {
      list-style: none;
      padding-left: 0;
      margin-top: 20px;
    }

    .legend li {
      font-size: 14px; color: #444; font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <div class="sidebar-section">
      <h1 style="font-weight: bold; font-size: 24px; color: #333;">The Cheesesteak Guide to Philadelphia</h1>
      <p style="font-size: 16px; color: #555;">This map shows you where you need to go if you want to taste the best cheesesteaks that Philadelphia has to offer.
</p>
    </div>

    <div class="sidebar-section">
      <div class="legend-wrapper">
        <ul class="legend">
          
        <li style="margin-bottom: 10px;">
            <img src="icons/tier_1.png" style="height: 32px; vertical-align: middle;">
            – The Best of the Best
        </li>
    
        <li style="margin-bottom: 10px;">
            <img src="icons/tier_2.png" style="height: 32px; vertical-align: middle;">
            – Standout Steaks
        </li>
    
        <li style="margin-bottom: 10px;">
            <img src="icons/tier_3.png" style="height: 32px; vertical-align: middle;">
            – Solid Steaks
        </li>
    
        <li style="margin-bottom: 10px;">
            <img src="icons/tier_4.png" style="height: 32px; vertical-align: middle;">
            – Off the Podium
        </li>
    
        <li style="margin-bottom: 10px;">
            <img src="icons/tier_5.png" style="height: 32px; vertical-align: middle;">
            – Tasting in Progress
        </li>
    
        </ul>
      </div>
    </div>
  </div>

  <div id="map-container">
    <iframe src="map.html"></iframe>
  </div>
</body>
</html>
