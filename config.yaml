# config.yaml
title: The Cheesesteak Guide to Philadelphia

description: >
  This map shows you where you need to go if you want to taste the best cheesesteaks that Philadelphia has to offer.

tier_dict:
  1: "The Best of the Best"
  2: "Standout Steaks"
  3: "Solid Steaks"
  4: "Off the Podium"
  5: "Tasting in Progress"

basemap_type: "CartoDB positron"

icon_file_type: "png"

sidebar_style:
  width: "300px"
  padding: "20px"
  background: "linear-gradient(to bottom, #f5f2ea, #e8e0d0)"
  border_right: "2px solid #ccc"
  box_shadow: "2px 0 6px rgba(0,0,0,0.2)"
  overflow_y: "auto"
  font_family: "'Raleway', sans-serif"
  sidebar_bg: "linear-gradient(to bottom, #e9efe8, #a4b99f, #e4d7c5, #c37c65)"
  title_style: "font-weight: bold; font-size: 24px; color: #333;"
  body_text_style: "font-size: 16px; color: #555;"
  legend_item_style: "font-size: 14px; color: #444; font-weight: bold;"

popup_style:
  border_color: "#228B22"         # forest green
  border_radius: "12px"
  background_color: "#000000"     # pure black
  text_color: "#FFFFFF"           # white for contrast
  highlight_color: "#FF0000"      # bright red
  image_border_radius: "6px"
  shadow: "3px 3px 8px rgba(255, 255, 255, 0.2)"  # subtle white shadow

